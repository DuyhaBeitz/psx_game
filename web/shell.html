        <script>
            // This prevents inputs from scrolling the webpage
            window.addEventListener(
                "keydown",
                function (e) {
                    if ( ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                        e.preventDefault();
                    }
