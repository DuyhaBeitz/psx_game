plugins { id 'com.android.application' }

def buildRoot = file(project.findProperty("buildRoot") ?: "../../android-build")
layout.buildDirectory.set(new File(buildRoot, "app"))

android {
    namespace 'com.yourname.game'
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.yourname.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake { arguments "-DPLATFORM=Android", "-DANDROID_STL=c++_static" }
        }
    }
    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            buildStagingDirectory new File(buildRoot, "cxx")
        }
    }
    sourceSets.main.assets.srcDirs = ["src/main/assets"]
}